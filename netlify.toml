[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Content-Security-Policy-Report-Only = "default-src 'self' * data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'unsafe-dynamic' * data: blob:; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' 'unsafe-dynamic' * data: blob:; style-src 'self' 'unsafe-inline' *; img-src 'self' * data: blob:; font-src 'self' * data:; connect-src 'self' *; frame-src 'self' *; media-src 'self' *; worker-src 'self' *; form-action 'self' *; frame-ancestors 'self' *; base-uri 'self' *; manifest-src 'self' *;"

[[redirects]]
  from = "/api/*"
  to = "https://craftai-n74y.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


