[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'unsafe-dynamic' https://accounts.google.com https://www.googleapis.com https://www.gstatic.com https://*.firebaseio.com https://*.firebaseapp.com https://*.firebasedatabase.app https://cdn.jsdelivr.net https://*.googleapis.com https://identitytoolkit.googleapis.com; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' 'unsafe-dynamic' https://accounts.google.com https://www.googleapis.com https://www.gstatic.com https://*.firebaseio.com https://*.firebaseapp.com https://*.firebasedatabase.app https://cdn.jsdelivr.net https://*.googleapis.com https://identitytoolkit.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.firebasedatabase.app https://*.googleapis.com https://identitytoolkit.googleapis.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.firebaseio.com;"

[[redirects]]
  from = "/api/*"
  to = "https://craftai-n74y.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


