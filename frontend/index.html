<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='url(%23g)' stroke-width='16' stroke-dasharray='220 60'/><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23F72585'/><stop offset='50%25' stop-color='%23A020F0'/><stop offset='100%25' stop-color='%233B82F6'/></linearGradient></defs></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Craft AI — Your Photo. Every Story.</title>
    <meta name="description" content="Personalized social media Story and Status creation platform. Upload your photo once, get automatically stylized social media stories in seconds." />
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Netlify Badge & Drawer Hider -->
    <style>
      a[href*="netlify.com"],
      a[href*="netlify.com/powered-by"],
      .netlify-badge,
      #netlify-badge,
      [data-netlify-badge],
      [data-netlify-deploy-status],
      netlify-drawer,
      .netlify-drawer,
      #netlify-drawer,
      #netlify-feedback-widget,
      [data-netlify-drawer],
      div[class*="netlify-badge"],
      div[id*="netlify-badge"],
      div[data-netlify-drawer],
      iframe[src*="netlify"],
      div:has(> a[href*="netlify.com"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: fixed !important;
        bottom: -9999px !important;
        right: -9999px !important;
        width: 0 !important;
        height: 0 !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      (function() {
        function removeNetlifyBadge() {
          const elements = document.querySelectorAll('a[href*="netlify.com"], netlify-drawer, iframe[src*="netlify"], div[class*="netlify"], #netlify-drawer');
          elements.forEach(function(el) {
            try {
              if (el && el.parentNode) {
                el.parentNode.removeChild(el);
              }
            } catch (e) {}
          });
          // Also check for any fixed bottom-right button with Netlify text
          const allButtons = document.querySelectorAll('button, a, div[role="button"]');
          allButtons.forEach(function(btn) {
            if (btn.innerText && btn.innerText.includes('Netlify')) {
              btn.style.setProperty('display', 'none', 'important');
              btn.remove();
            }
          });
        }
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
          window.addEventListener('load', removeNetlifyBadge);
          setInterval(removeNetlifyBadge, 400);
        }
      })();
    </script>
  </head>
  <body class="bg-white text-gray-900 min-h-screen antialiased selection:bg-purple-100 selection:text-purple-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
