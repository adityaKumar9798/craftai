<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='url(%23g)' stroke-width='16' stroke-dasharray='220 60'/><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23F72585'/><stop offset='50%25' stop-color='%23A020F0'/><stop offset='100%25' stop-color='%233B82F6'/></linearGradient></defs></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Craft AI — Your Photo. Every Story.</title>
    <meta name="description" content="Personalized social media Story and Status creation platform. Upload your photo once, get automatically stylized social media stories in seconds." />
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Netlify Badge & Drawer Hider (Only targets external injected elements outside React #root) -->
    <style>
      body > netlify-drawer,
      body > .netlify-drawer,
      body > #netlify-drawer,
      body > iframe[src*="netlify"],
      body > #netlify-feedback-widget,
      body > [data-netlify-drawer],
      body > [data-netlify-badge],
      body > div:not(#root) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: fixed !important;
        top: -99999px !important;
        left: -99999px !important;
        width: 0 !important;
        height: 0 !important;
        z-index: -99999 !important;
      }
    </style>

    <script>
      (function() {
        function removeExternalNetlifyInjections() {
          try {
            var children = document.body.children;
            for (var i = children.length - 1; i >= 0; i--) {
              var el = children[i];
              if (el && el.id !== 'root' && el.tagName !== 'SCRIPT' && el.tagName !== 'LINK' && el.tagName !== 'STYLE') {
                el.style.display = 'none';
                try { el.remove(); } catch(e) {}
              }
            }
          } catch(err) {}
        }

        if (typeof window !== 'undefined') {
          document.addEventListener('DOMContentLoaded', removeExternalNetlifyInjections);
          window.addEventListener('load', removeExternalNetlifyInjections);
          setInterval(removeExternalNetlifyInjections, 500);
          if (window.MutationObserver) {
            new MutationObserver(removeExternalNetlifyInjections).observe(document.body, { childList: true });
          }
        }
      })();
    </script>
  </head>
  <body class="bg-white text-gray-900 min-h-screen antialiased selection:bg-purple-100 selection:text-purple-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
